<html lang="es">
<head>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Fuentes oficiales Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EDECEE;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Contenedor central compacto, medido y minimalista */
    .brand-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 250px;
      padding: 12px;
    }

    .logo-svg {
      width: 100%;
      height: auto;
      max-height: 50vh;
      overflow: visible;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.04));
    }

    /* Indicador de provincia y puntos ocultos a petición del usuario */
    .province-indicator {
      display: none;
    }

    .province-name-wrapper {
      height: 18px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
    }

    .province-name {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #1C1C1C;
      display: inline-block;
      text-align: center;
      will-change: transform, opacity;
    }

    .province-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prov-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 3px;
      background-color: #D1D5DB;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .prov-dot:hover {
      background-color: #007A33;
      transform: scale(1.25);
    }

    .prov-dot.active {
      background-color: #007A33;
      width: 14px;
    }

    .badge-soon {
      margin-top: 22px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #9CA3AF;
    }

    /* Vuelo fluido de la bandada de flamencos pequeños en línea recta por detrás del edificio */
    .flock-flight-group {
      will-change: transform, opacity;
      pointer-events: none;
    }

    .f-mini-wing {
      transform-origin: 0px 0px;
      animation: flapMini 0.55s ease-in-out infinite;
    }
    @keyframes flapMini {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.45); }
    }
  </style>
</head>

  <script>
    const provinceIds = [
      'sceneCordoba', 'sceneSevilla', 'sceneGranada', 'sceneHuelva',
      'sceneCadiz', 'sceneJaen', 'sceneMalaga', 'sceneAlmeria'
    ];

    const provinceNames = [
      'CÓRDOBA', 'SEVILLA', 'GRANADA', 'HUELVA',
      'CÁDIZ', 'JAÉN', 'MÁLAGA', 'ALMERÍA'
    ];

    let currentIndex = 0;
    let mainLoopTimeout = null;
    let activeTimeline = null;
    // Velocidad global de todas las provincias: 1 = original, menor = más lento
    const SPEED = 0.6;

    function getElementLength(el) {
      if (el.getTotalLength) {
        try {
          const l = el.getTotalLength();
          if (l > 0) return l;
        } catch(e) {}
      }
      const tag = el.tagName.toLowerCase();
      if (tag === 'line') {
        const x1 = parseFloat(el.getAttribute('x1') || 0);
        const y1 = parseFloat(el.getAttribute('y1') || 0);
        const x2 = parseFloat(el.getAttribute('x2') || 0);
        const y2 = parseFloat(el.getAttribute('y2') || 0);
        return Math.hypot(x2 - x1, y2 - y1) || 50;
      }
      if (tag === 'circle') {
        const r = parseFloat(el.getAttribute('r') || 1);
        return 2 * Math.PI * r;
      }
      if (tag === 'rect') {
        const w = parseFloat(el.getAttribute('width') || 0);
        const h = parseFloat(el.getAttribute('height') || 0);
        return 2 * (w + h) || 50;
      }
      return 60;
    }

    window.addEventListener('DOMContentLoaded', () => {
      provinceIds.forEach((id, i) => {
        const el = document.getElementById(id);
        if (el) {
          el.style.display = (i === 0) ? 'block' : 'none';
        }
      });

      runProvinceCycle(0);
    });

    function jumpToProvince(idx) {
      if (idx === currentIndex) return;
      if (mainLoopTimeout) clearTimeout(mainLoopTimeout);
      if (activeTimeline) activeTimeline.kill();

      provinceIds.forEach((id, i) => {
        const el = document.getElementById(id);
        if (el) {
          gsap.killTweensOf(el);
          gsap.killTweensOf(el.querySelectorAll('*'));
          if (i !== idx) {
            el.style.display = 'none';
            el.style.opacity = 0;
          }
        }
      });

      const nextEl = document.getElementById(provinceIds[idx]);
      if (nextEl) {
        nextEl.style.display = 'block';
        nextEl.style.opacity = 1;
      }
      runProvinceCycle(idx);
    }

    function updateProvinceLabel(newIndex) {
      const label = document.getElementById('provinceLabel');
      if (!label) return;

      gsap.to(label, {
        y: -12,
        opacity: 0,
        duration: 0.20,
        ease: "power2.in",
        onComplete: () => {
          label.textContent = provinceNames[newIndex];
          gsap.fromTo(label,
            { y: 12, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }
          );
        }
      });
    }

    function runProvinceCycle(targetIdx) {
      currentIndex = targetIdx;
      const currentEl = document.getElementById(provinceIds[currentIndex]);
      const dots = document.querySelectorAll('.prov-dot');

      updateProvinceLabel(currentIndex);

      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });

      buildProvince(currentEl, () => {
        mainLoopTimeout = setTimeout(() => {
          deconstructProvince(currentEl, () => {
            currentEl.style.display = 'none';

            const nextIdx = (currentIndex + 1) % provinceIds.length;
            const nextEl = document.getElementById(provinceIds[nextIdx]);
            if (nextEl) {
              nextEl.style.display = 'block';
            }
            runProvinceCycle(nextIdx);
          });
        }, 550 / SPEED);
      });
    }

    function buildProvince(sceneEl, onComplete) {
      if (!sceneEl || typeof gsap === 'undefined') {
        if (onComplete) onComplete();
        return;
      }

      // Reset y aislamiento de todas las demás escenas
      provinceIds.forEach(id => {
        if (id !== sceneEl.id) {
          const other = document.getElementById(id);
          if (other) {
            gsap.killTweensOf(other);
            gsap.killTweensOf(other.querySelectorAll('*'));
            gsap.set(other.querySelectorAll('.draw-stroke'), { clearProps: "transform,opacity" });
            other.style.display = 'none';
            other.style.opacity = 0;
          }
        }
      });

      // Limpiar propiedades residuales de ciclos anteriores en la escena activa
      gsap.killTweensOf(sceneEl);
      gsap.killTweensOf(sceneEl.querySelectorAll('*'));
      gsap.set(sceneEl.querySelectorAll('.draw-stroke'), { clearProps: "transform" });
      gsap.set(sceneEl, { opacity: 1, display: 'block' });

      const strokeElements = sceneEl.querySelectorAll('.draw-stroke');
      strokeElements.forEach(el => {
        const len = getElementLength(el);
        el.style.strokeDasharray = len + ' ' + (len + 2);
        el.style.strokeDashoffset = len;
      });

      const tl = gsap.timeline({
        onComplete: onComplete
      }).timeScale(SPEED);
      activeTimeline = tl;

      if (sceneEl.id === 'sceneCordoba') {
        const cols = sceneEl.querySelectorAll('.tier-1 .draw-stroke');
        const bay0 = sceneEl.querySelectorAll('.tier-2 .bay-0');
        const bay1 = sceneEl.querySelectorAll('.tier-2 .bay-1');
        const bay2 = sceneEl.querySelectorAll('.tier-2 .bay-2');

        tl.fromTo(cols,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 12 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.32, stagger: 0.015, ease: "power2.out" }
        );

        tl.fromTo(bay0,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 16 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.30, stagger: 0.012, ease: "power2.out" },
          "-=0.2"
        );
        tl.fromTo(bay1,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 16 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.30, stagger: 0.012, ease: "power2.out" },
          "-=0.22"
        );
        tl.fromTo(bay2,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 16 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.30, stagger: 0.012, ease: "power2.out" },
          "-=0.22"
        );
        return;
      }

      if (sceneEl.id === 'sceneSevilla') {
        const giralda = sceneEl.querySelectorAll('.tier-2 .draw-stroke, .tier-3 .draw-stroke, .tier-4 .draw-stroke');
        const muralla = sceneEl.querySelectorAll('.tier-1 .draw-stroke');
        const catedral = sceneEl.querySelectorAll('#catedralFondo .draw-stroke');

        // 1. La Torre de la Giralda COMPLETA
        tl.fromTo(giralda,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 15 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.36, stagger: 0.004, ease: "power2.out" }
        );

        // 2. Muralla y naranjos
        tl.fromTo(muralla,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 10 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.26, stagger: 0.004, ease: "power2.out" },
          "-=0.22"
        );

        // 3. El fondo de la catedral se carga DESPUÉS de la torre
        tl.fromTo(catedral,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 12 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.32, stagger: 0.005, ease: "power2.out" },
          "+=0.04"
        );
        return;
      }

      if (sceneEl.id === 'sceneHuelva') {
        const flock = sceneEl.querySelector('#flockFlight');
        if (flock) {
          gsap.killTweensOf(flock);
          const birds = flock.querySelectorAll('.flock-bird');
          birds.forEach(b => {
            const bx = b.getAttribute('data-x') || 0;
            const by = b.getAttribute('data-y') || 0;
            const bs = b.getAttribute('data-s') || 0.5;
            b.setAttribute('transform', `translate(${bx}, ${by}) scale(${bs})`);
          });
          // Vuelo centrado sobre la barra negra (x 52 a 102), a la altura del campanario (y=-33), por detrás del campanario
          // El grupo empieza en x=52 para que la rama trasera (data-x hasta -25) quede dentro de la barra
          gsap.set(flock, { x: 52, y: -33, opacity: 0 });
          const flightTl = gsap.timeline().timeScale(SPEED);
          flightTl.to(flock, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.05)
                  .to(flock, { x: 102, duration: 0.75, ease: "none" }, 0.05)
                  .to(flock, { y: "-=3", duration: 0.25, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0.05)
                  .to(flock, { opacity: 0, duration: 0.2, ease: "power1.in" }, 0.75);
        }
      }

      if (sceneEl.id === 'sceneGranada') {
        const chorroGroup = sceneEl.querySelector('#granadaChorro');
        if (chorroGroup) {
          gsap.killTweensOf(chorroGroup.children);
          gsap.set(chorroGroup, { display: 'none', opacity: 0 });
        }
      }

      const t1 = sceneEl.querySelectorAll('.tier-1 .draw-stroke');
      const t2 = sceneEl.querySelectorAll('.tier-2 .draw-stroke');
      const t3 = sceneEl.querySelectorAll('.tier-3 .draw-stroke');
      const t4 = sceneEl.querySelectorAll('.tier-4 .draw-stroke');

      if (t1.length > 0) {
        tl.fromTo(t1,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 10 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.20, stagger: 0.004, ease: "power2.out" }
        );
      }

      if (t2.length > 0) {
        tl.fromTo(t2,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 15 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.20, stagger: 0.004, ease: "power2.out" },
          "-=0.2"
        );
      }

      if (t3.length > 0) {
        tl.fromTo(t3,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 18 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.30, stagger: 0.004, ease: "power2.out" },
          "-=0.2"
        );
      }

      if (t4.length > 0) {
        tl.fromTo(t4,
          { strokeDashoffset: (i, el) => getElementLength(el), opacity: 0, y: 20 },
          { strokeDashoffset: 0, opacity: 1, y: 0, duration: 0.30, stagger: 0.004, ease: "back.out(1.15)" },
          "-=0.18"
        );
      }

      // En Granada: PRIMERO se carga toda la arquitectura y leones, y LUEGO brotan los chorros de la boca de los leones hacia el suelo
      if (sceneEl.id === 'sceneGranada') {
        const chorroGroup = sceneEl.querySelector('#granadaChorro');
        if (chorroGroup) {
          const streams = chorroGroup.querySelectorAll('.water-stream');
          const ripples = chorroGroup.querySelectorAll('.water-ripple');
          const drops = chorroGroup.querySelectorAll('.water-drop');

          streams.forEach(el => {
            const len = el.getTotalLength ? el.getTotalLength() : 20;
            el.style.strokeDasharray = len + ' ' + (len + 2);
            el.style.strokeDashoffset = len;
          });
          gsap.set(ripples, { opacity: 0, scaleX: 0, transformOrigin: "center" });
          gsap.set(drops, { opacity: 0, scale: 0, transformOrigin: "center" });

          // Revelar contenedor solo al llegar a este punto de la animación (tras consolidar arquitectura)
          tl.set(chorroGroup, { display: 'block', opacity: 1 }, "+=0.08");

          // Chorros brotando de las 3 bocas de los leones hacia el suelo
          tl.to(streams, {
            strokeDashoffset: 0,
            duration: 0.42,
            stagger: 0.06,
            ease: "power2.out"
          });

          // Ondas y salpicaduras en el suelo
          tl.to(ripples, {
            opacity: 1,
            scaleX: 1,
            duration: 0.25,
            stagger: 0.04,
            ease: "power2.out"
          }, "-=0.22");

          tl.to(drops, {
            opacity: 1,
            scale: 1,
            duration: 0.22,
            stagger: 0.04,
            ease: "back.out(1.8)"
          }, "-=0.22");
        }
      }
    }

    function deconstructProvince(sceneEl, onComplete) {
      if (!sceneEl || typeof gsap === 'undefined') {
        if (onComplete) onComplete();
        return;
      }

      gsap.killTweensOf(sceneEl);
      gsap.killTweensOf(sceneEl.querySelectorAll('*'));

      if (sceneEl.id === 'sceneGranada') {
        const chorroGroup = sceneEl.querySelector('#granadaChorro');
        if (chorroGroup) {
          gsap.set(chorroGroup, { display: 'none', opacity: 0 });
        }
      }
      if (sceneEl.id === 'sceneHuelva') {
        const flock = sceneEl.querySelector('#flockFlight');
        if (flock) {
          gsap.set(flock, { opacity: 0, x: -28, y: -33 });
        }
      }

      const elements = sceneEl.querySelectorAll('.draw-stroke');
      const tl = gsap.timeline({
        onComplete: () => {
          // Limpiar estilos residuales para que los segundos ciclos arranquen impecables
          gsap.set(elements, { clearProps: "transform,opacity" });
          sceneEl.style.display = 'none';
          sceneEl.style.opacity = 0;
          if (onComplete) onComplete();
        }
      }).timeScale(SPEED);
      activeTimeline = tl;

      tl.to(elements, {
        y: 10,
        opacity: 0,
        duration: 0.20,
        stagger: { each: 0.005, from: "top" },
        ease: "power2.in"
      });
    }
  </script>
</body>
</html>
